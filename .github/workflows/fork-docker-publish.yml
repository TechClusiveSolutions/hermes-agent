# Fork-local image publish for TechClusiveSolutions/hermes-agent.
#
# Upstream's docker.yml is gated to `github.repository ==
# 'NousResearch/hermes-agent'` and publishes to their Docker Hub org with
# their environment-scoped secrets, so it can never run on this fork. This
# workflow is our replacement deploy artifact: it builds the repo's existing
# Dockerfile and publishes to GHCR under our org using only the built-in
# GITHUB_TOKEN — no external registry secrets to manage.
#
# Deployment (fornax) then pins:
#   image: ghcr.io/techclusivesolutions/hermes-agent:main
# and upgrades become `docker compose pull && docker compose up -d` after a
# merge to main, instead of hand-editing a running container.
#
# New file, deliberately: upstream files are never edited, so syncing this
# fork with upstream main stays conflict-free.

name: Fork Docker Publish (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/techclusivesolutions/hermes-agent

jobs:
  build-and-publish:
    if: github.repository == 'TechClusiveSolutions/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: fornax is an x86 e2-micro. Add an arm64 leg later
      # if a deployment target needs it (mirroring upstream docker.yml's
      # matrix), rather than paying the emulated-build cost now.
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=fork-docker-amd64
          cache-to: type=gha,mode=max,scope=fork-docker-amd64

      - name: Report published tags
        run: |
          echo "Published:"
          echo "  ${IMAGE_NAME}:main"
          echo "  ${IMAGE_NAME}:latest"
          echo "  ${IMAGE_NAME}:${GITHUB_SHA}"
